<script>
const sb=supabase.createClient('https://mdtfbyusnawqhmyatlxe.supabase.co','sb_publishable_VNDuXu5-9NkohXIanJY-Sw_doqjCuZn');
const mail=u=>u.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@vd-app.hu';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $=s=>document.querySelector(s),LS=localStorage,p2=n=>String(n).padStart(2,'0');
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const T=[''];for(let h=0;h<24;h++)for(let m=0;m<60;m+=5)T.push(p2(h)+':'+p2(m));
const TO=T.map(v=>[v,v||'–']),PA=[['','–'],['0','0'],['1','1']],ST=[['','–'],['K','K'],['U','U'],['A','A']],
MO=MON.map((x,i)=>[i,x]),YR=[...Array(12)].map((_,i)=>[2024+i,2024+i]),DY=[...Array(28)].map((_,i)=>[i+1,i+1]);
const LEG='K= Krank  U=Urlaub  A=Abholung';
let cur=LS.vd_cur,D,S,V='home',NT='p',tmr,st,base=null,ch=null,MC=null;
let UID,PK,PM=new Date().getMonth(),PY=new Date().getFullYear(),PH={};
const HUM=['januar','februar','marcius','aprilis','majus','junius','julius','augusztus','szeptember','oktober','november','december'];
const SD='<rect x="2" y="8" width="36" height="22"/><path d="M38 30V14h10l10 10v6z"/><circle cx="14" cy="32" r="5"/><circle cx="48" cy="32" r="5"/>';
const SL=[['elolrol','Elölről'],['balrol','Bal oldal'],['jobbrol','Jobb oldal'],['hatulrol','Hátulról'],['lenyitva','Lenyitva'],['forgalmi','Forgalmi'],['homero','Hőmérő'],['baleset','Baleset / Nem várt események'],['egyeb','Egyéb dok.']];
const IC={
 elolrol:'<rect x="14" y="4" width="36" height="26" rx="4"/><rect x="19" y="8" width="26" height="10" rx="2"/><circle cx="21" cy="24" r="2"/><circle cx="43" cy="24" r="2"/><rect x="10" y="30" width="9" height="9"/><rect x="45" y="30" width="9" height="9"/>',
 balrol:SD,
 jobbrol:'<g transform="translate(64 0) scale(-1 1)">'+SD+'</g>',
 hatulrol:'<rect x="12" y="4" width="40" height="28"/><path d="M32 4v28M28 18v4M36 18v4"/><rect x="10" y="32" width="10" height="7"/><rect x="44" y="32" width="10" height="7"/>',
 lenyitva:'<rect x="22" y="6" width="20" height="26"/><path d="M22 6L8 11v21h14M42 6l14 5v21H42"/><rect x="10" y="32" width="10" height="7"/><rect x="44" y="32" width="10" height="7"/>',
 forgalmi:'<rect x="10" y="4" width="44" height="32" rx="3"/><path d="M16 14h20M16 20h32M16 26h24"/>',
 homero:'<path d="M28 6a4 4 0 0 1 8 0v17.1a8 8 0 1 1-8 0z"/><path d="M32 12v14"/><circle cx="32" cy="30" r="3"/><path d="M40 8h5M40 14h5M40 20h5"/>',
 baleset:'<path d="M32 4L59 36H5z"/><path d="M32 15v11"/><circle cx="32" cy="31" r="1.3"/>',
 egyeb:'<path d="M18 4h20l10 10v22H18z"/><path d="M38 4v10h10M24 22h18M24 28h18"/>'};
const ic=k=>`<svg viewBox="0 0 64 40">${IC[k]}</svg>`;
const pn=k=>k+'_'+HUM[PM]+'_'+PY;
const pdir=()=>UID+'/'+PY+'-'+p2(PM+1);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(a,s)=>a.map(([v,t])=>`<option value="${v}"${v==s?' selected':''}>${t}</option>`).join('');
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const blank=()=>({id:rid(),name:'',routes:[],lkw:[],kenn:[],sheets:[],sig:''});
const sk=x=>x.t+'-'+x.y+'-'+x.m;
const fp=d=>JSON.stringify([(d.sheets||[]).map(x=>sk(x)+':'+(x.ts||0)).sort(),d.del||{},d.lt||0,d.name,d.sig?1:0,d.routes,d.lkw,d.kenn]);
function merge(c,l){
 const del={};for(const o of[c.del||{},l.del||{}])for(const k in o)del[k]=Math.max(del[k]||0,o[k]);
 const m={};for(const x of[...(c.sheets||[]),...(l.sheets||[])]){const k=sk(x);if(!m[k]||(x.ts||0)>=(m[k].ts||0))m[k]=x}
 const sheets=Object.values(m).filter(x=>del[sk(x)]===undefined||(x.ts||0)>del[sk(x)]);
 const u=(a,b)=>[...new Set([...(a||[]),...(b||[])])],cl=c.lt||0,ll=l.lt||0;
 const li=k=>cl===ll?u(c[k],l[k]):(ll>cl?l[k]:c[k])||[];
 return{...c,...l,id:l.id||c.id,name:l.name||c.name,sig:l.sig||c.sig,routes:li('routes'),lkw:li('lkw'),kenn:li('kenn'),lt:Math.max(cl,ll),sheets,del}}
function relink(){if(!S)return;const n=D.sheets.find(x=>sk(x)==sk(S));if(n)S=n;else{S=null;if(V=='e')V='home'}}
function save(){LS['vd_d_'+cur]=JSON.stringify(D);clearTimeout(st);st=setTimeout(push,800)}
async function cloud(){const{data:{user}}=await sb.auth.getUser();if(!user)return null;
 const{data:row,error}=await sb.from('vd_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
 return error?null:{user,row}}
async function push(){if(!cur||!D)return;
 try{const r=await cloud();if(!r)return;
  if(r.row&&Date.parse(r.row.updated_at)!==base){D=merge(r.row.data,D);relink()}
  const ts=Date.now();
  const{error}=await sb.from('vd_data').upsert({user_id:r.user.id,data:D,updated_at:new Date(ts).toISOString()});
  if(!error){base=ts;LS['vd_d_'+cur]=JSON.stringify(D)}}catch(e){}}
async function pull(){if(!cur||!D)return;
 try{const r=await cloud();if(!r||!r.row)return;
  const t=Date.parse(r.row.updated_at);if(t===base)return;
  const before=fp(D);D=merge(r.row.data,D);base=t;relink();LS['vd_d_'+cur]=JSON.stringify(D);
  if(fp(D)===before)return;
  const a=document.activeElement;if(V!='e'||!a||!/INPUT|SELECT/.test(a.tagName))draw()}catch(e){}}
function listen(){try{ch=sb.channel('vd').on('postgres_changes',{event:'*',schema:'public',table:'vd_data'},()=>pull()).subscribe()}catch(e){}}
setInterval(()=>{if(!document.hidden)pull()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
window.addEventListener('focus',pull);
const mi=t=>{const[h,m]=t.split(':');return h*60+ +m};
const dur=w=>(!w||!w.b||!w.e)?null:Math.max(0,(mi(w.e)-mi(w.b)+1440)%1440-(+w.p||0)*60);
const fmt=m=>m==null?'':Math.floor(m/60)+':'+p2(m%60);
const tot=s=>{let t=0;for(const k in s.rows)t+=dur(s.rows[k])||0;return t};
const uid=()=>D.id,fn=s=>(s.t=='p'?'jelenleti':'tankolas')+'_'+s.y+'-'+p2(s.m+1);
const b64=d=>d.output('datauristring').split(',')[1];
const dl=k=>D[k].map(x=>`<option value="${esc(x)}">`).join('');

/* ---------- Logó (vízjel) és impresszum a PDF-eken ---------- */
const LOGO_FILE='logo.png',LOGO_H=16,LOGO_W=LOGO_H*221/248,LOGO_OP=.10,LOGO_X=15,LOGO_Y=3.5;
const CREDIT='Erstellt von Vivien\'s Creative Mind',SITE='www.vivienscreativemind.com',SITE_URL='https://www.vivienscreativemind.com';
let LOGO=null;
async function loadLogo(){try{const r=await fetch(LOGO_FILE);if(!r.ok)return;const b=await r.blob();
 LOGO=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)})}catch(e){}}

/* ---------- e-mail küldés (a Supabase send-mail függvényen keresztül, a felhasználó saját Gmailjéről) ---------- */
const gm=x=>/^[^\s@]+@(gmail|googlemail)\.com$/i.test(x),em=x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x);
const noMC=u=>({user_id:u,sender_email:'',recipient_email:'',auto:false,day:1,has_pass:false});
async function loadMail(){let u=null;
 try{u=(await sb.auth.getUser()).data.user.id;
  const{data}=await sb.from('vd_mail').select('*').eq('user_id',u).maybeSingle();
  MC=data||noMC(u)}catch(e){MC=noMC(u)}}
async function call(body){const{data,error}=await sb.functions.invoke('send-mail',{body});
 if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw Error(m)}
 if(data&&data.ok===false)throw Error(data.error);return data}
async function saveMailCfg(){
 const s=$('#ms').value.trim().toLowerCase(),r=$('#mr').value.trim(),a=$('#ma').checked,d=+$('#md').value;
 if(!gm(s))return alert('Saját címnek Gmail-cím kell (gmail.com).');
 if(!em(r))return alert('Adj meg érvényes fogadó e-mail címet.');
 const hp=s===MC.sender_email?MC.has_pass:false;
 if(a&&!hp)return alert('Az automatikus küldéshez előbb mentsd el az alkalmazásjelszót.');
 const{error}=await sb.from('vd_mail').upsert({user_id:MC.user_id,sender_email:s,recipient_email:r,auto:a,day:d,has_pass:hp});
 if(error)return alert(error.message);
 await loadMail();draw();alert('Mentve.')}
async function savePass(){const p=$('#mp').value.trim();
 if(!p)return alert('Írd be az alkalmazásjelszót.');
 if(!MC.sender_email)return alert('Előbb mentsd el a Gmail-címedet.');
 try{await call({action:'pass',pass:p});await loadMail();draw();alert('A Gmail elfogadta, a jelszó mentve.')}catch(e){alert(e.message)}}
async function delPass(){if(!confirm('Törlöd az alkalmazásjelszót? Az automatikus küldés is kikapcsol.'))return;
 try{await call({action:'delpass'});await loadMail();draw()}catch(e){alert(e.message)}}
async function sendPrev(){try{const r=await call({prev:true});alert(`Elküldve (${r.sent} ív, ${r.photos} kép) ide: ${r.to}`)}catch(e){alert(e.message)}}
async function sendSheet(){
 if(!MC||!MC.has_pass||!MC.recipient_email)return alert('Előbb add meg a Profilban a címeket és az alkalmazásjelszót.');
 clearTimeout(st);await push();
 try{const r=await call({y:S.y,m:S.m});alert(`Elküldve (${r.sent} ív, ${r.photos} kép) ide: ${r.to}`)}catch(e){alert(e.message)}}

function login(){$('#app').innerHTML=`<main style="max-width:380px;margin:auto"><div class="card"><h2 style="color:#4caf7a">Workplace</h2><p><input id="u" placeholder="Felhasználónév"></p><p><input id="p" type="password" placeholder="Jelszó (min. 6 karakter)"></p><div class="row"><button onclick="auth(0)">Belépés</button><button class="g" onclick="auth(1)">Regisztráció</button></div></div></main>`}
async function auth(reg){const u=$('#u').value.trim(),p=$('#p').value;
 if(!u||!p)return alert('Töltsd ki mindkét mezőt');
 const r=reg?await sb.auth.signUp({email:mail(u),password:p}):await sb.auth.signInWithPassword({email:mail(u),password:p});
 if(r.error)return alert(r.error.message);
 await load(u)}
async function load(u){const r=await cloud();
 if(!r)return alert('Sikertelen belépés vagy nincs kapcsolat');
 cur=u;LS.vd_cur=u;UID=r.user.id;
 const loc=LS['vd_d_'+u]?JSON.parse(LS['vd_d_'+u]):null;
 if(r.row?.data?.sheets){D=loc?merge(r.row.data,loc):r.row.data;base=Date.parse(r.row.updated_at)}
 else{D=loc||blank();base=null}
 if(!D.id)D.id=rid();
 save();if(ch)sb.removeChannel(ch);listen();await loadMail();V='home';draw()}
async function logout(){if(ch){sb.removeChannel(ch);ch=null}await sb.auth.signOut();LS.removeItem('vd_cur');cur=null;D=S=MC=null;base=null;draw()}
function go(v){V=v;draw();if(v=='ph')loadPh()}

function draw(){if(!cur)return login();
 const c=V=='e'?S.t:V=='n'?NT:V;
 $('#app').innerHTML=`<nav><b>Workplace</b>${[['home','Kezdőlap'],['p','Jelenléti'],['t','Tankolás'],['ph','Fényképek'],['b','Bérszámfejtés','Bér'],['prof','Profil']].map(([k,t,sh])=>`<button class="${c==k?'':'g'}" onclick="go('${k}')"><span class="ll">${t}</span><span class="ls">${sh||t}</span></button>`).join('')}<button class="g lo" onclick="logout()">Kilépés</button></nav><main>${V=='home'?home():V=='p'||V=='t'?list(V):V=='n'?nv():V=='e'?edit():V=='ph'?ph():V=='b'?ber():prof()}</main>`;
 if(V=='e')initSig()}
const home=()=>`<h2>Szia${D.name?', '+esc(D.name):''}!</h2><div class="big"><button onclick="go('p')">Jelenléti</button><button onclick="go('t')">Tankolás</button><button onclick="go('ph')">Fényképek</button><button onclick="go('b')">Bérszámfejtés</button></div>`;
function list(t){const a=D.sheets.filter(s=>s.t==t).sort((a,b)=>b.y*12+b.m-a.y*12-a.m);
 return `<h2>${t=='p'?'Jelenléti ívek':'Tankolási ívek'}</h2><div class="row" style="margin-bottom:12px"><button class="g" onclick="$('#imp').click()">Import (${t=='p'?'jelenléti':'tankolási'} PDF)</button><input id="imp" type="file" accept="application/pdf" hidden onchange="imp(this,'${t}')"></div>${a.map(s=>`<div class="card row" style="justify-content:space-between"><span>${MON[s.m]} ${s.y}</span><span><button onclick="op(${s.id})">Megnyitás</button> <button class="r" onclick="rm(${s.id})">✕</button></span></div>`).join('')||'<i>Még nincs ív</i>'}<button class="fab" onclick="NT='${t}';go('n')">+</button>`}
function op(id){S=D.sheets.find(s=>s.id==id);go('e')}
function rm(id){if(!confirm('Törlöd az ívet?'))return;const x=D.sheets.find(s=>s.id==id);if(x)(D.del=D.del||{})[sk(x)]=Date.now();D.sheets=D.sheets.filter(s=>s.id!=id);save();draw()}
const nv=()=>{const n=new Date();return `<h2>Új ív</h2><div class="card row"><select id="nm">${opts(MO,n.getMonth())}</select><select id="ny">${opts(YR,n.getFullYear())}</select><button onclick="mkNew()">Létrehozás</button><button class="g" onclick="go('${NT}')">Mégse</button></div>`};
function mkNew(){const m=+$('#nm').value,y=+$('#ny').value;
 S=D.sheets.find(s=>s.t==NT&&s.m==m&&s.y==y);
 if(!S){S={id:Date.now(),t:NT,y,m,name:D.name,rows:{},sig:D.sig||'',ts:Date.now()};D.sheets.push(S);save()}
 go('e')}

const I=(d,f,w,l)=>`<td><input data-d="${d}" data-f="${f}" value="${esc(w[f])}"${l?` list="dl-${f}"`:''}></td>`;
const Sl=(d,f,w,o)=>`<td><select data-d="${d}" data-f="${f}">${opts(o,w[f]||'')}</select></td>`;
function edit(){const f=S.t=='t';let r='';
 for(let d=1;d<=31;d++){const x=S.rows[d]||{};
  r+=`<tr><td>${d}</td>`+(f?I(d,'l',x,1)+I(d,'n',x,1)+I(d,'k',x)+I(d,'i',x)+I(d,'a',x)
   :Sl(d,'b',x,TO)+Sl(d,'e',x,TO)+Sl(d,'p',x,PA)+`<td id="du${d}">${fmt(dur(x))}</td>`+Sl(d,'x',x,ST)+I(d,'r',x,1)+I(d,'s',x))+'</tr>'}
 const H=f?['Nr.','TOUR/LKW NUMMER','Kennzeichen','Km Stand','Liter','AdBlue']:['Tag','Beginn (Uhrzeit)','Ende (Uhrzeit)','Pause','Dauer','*','Reiseweg','Spesen €'];
 return `<datalist id="dl-r">${dl('routes')}</datalist><datalist id="dl-l">${dl('lkw')}</datalist><datalist id="dl-n">${dl('kenn')}</datalist>
 <div class="card row"><b>${f?'Tankolás':'E&V GmbH'}</b><label>NAME <input id="nm" value="${esc(S.name)}"></label><label>MONAT <select id="sm">${opts(MO,S.m)}</select></label><label>JAHR <select id="sy">${opts(YR,S.y)}</select></label></div>
 <div class="wrap card"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${r}</table></div>
 ${f?'':`<div class="card">Summe: <b id="tot">${fmt(tot(S))}</b> &nbsp; <small>* ${LEG}</small></div>`}

const addD=(dt,n)=>new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+n);
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
function holidays(y,bl){const H={},E0=easter(y),add=(dt,n)=>{H[dt.getMonth()+'-'+dt.getDate()]=n},set=(m,d,n)=>{H[m+'-'+d]=n};
 set(0,1,'Neujahr');add(addD(E0,-2),'Karfreitag');add(addD(E0,1),'Ostermontag');set(4,1,'Tag der Arbeit');add(addD(E0,39),'Christi Himmelfahrt');add(addD(E0,50),'Pfingstmontag');set(9,3,'Tag der Deutschen Einheit');set(11,25,'1. Weihnachtstag');set(11,26,'2. Weihnachtstag');

/* § 3b EStG: a nap százalékos pótléka (vasárnap 50, ünnep 125, 150: 12.25/26 és 05.01; 12.24 14 órától 150, 12.31 14 órától 125) */
function dayPct(date,H,tod){const g=date.getDay(),m=date.getMonth(),d=date.getDate();let p=g==0?50:0;
 if(H[m+'-'+d])p=Math.max(p,(m==11&&(d==25||d==26))||(m==4&&d==1)?150:125);
 if(m==11&&d==24&&tod>=840)p=Math.max(p,150);
 if(m==11&&d==31&&tod>=840)p=Math.max(p,125);
 return p}
/* egy műszak percei pótlék-kategóriánként; az éjszaka 20–06 (25%), éjfél előtt kezdett éjszakai munkánál 0–4 óra 40% */
function surch(y,m,d,w,H){const r={n25:0,n40:0,s50:0,h125:0,h150:0},b=mi(w.b);let e=mi(w.e);const cross=e<=b;if(cross)e+=1440;
 const start=new Date(y,m,d),carry=dayPct(start,H,0);
 for(let t=b;t<e;t++){const off=t>=1440?1:0,tod=t-off*1440,date=off?addD(start,1):start;
  if(tod>=1200||tod<360){if(tod<240&&off&&cross)r.n40++;else r.n25++}
  let pd=dayPct(date,H,tod);if(off&&cross&&tod<240)pd=Math.max(pd,carry);
  if(pd==50)r.s50++;else if(pd==125)r.h125++;else if(pd==150)r.h150++}
 return r}

/* § 32a EStG 2026 tarifa + PAP 2026 (Lohnsteuer) */
function tarif(x){x=Math.floor(x);if(x<=12348)return 0;
 if(x<=17799){const y=(x-12348)/1e4;return Math.floor((914.51*y+1400)*y)}
 if(x<=69878){const z=(x-17799)/1e4;return Math.floor((173.1*z+2397)*z+1034.87)}
 if(x<=277825)return Math.floor(.42*x-11135.63);
 return Math.floor(.45*x-19470.38)}
function up56(zx){const diff=(tarif(zx*1.25)-tarif(zx*.75))*2,mist=Math.floor(zx*.14);return Math.max(diff,mist)}
function st56(x){const W1=14071,W2=34939,W3=222260;x=Math.floor(x);let s;
 if(x>W2){s=up56(W2);if(x>W3)s+=(W3-W2)*.42+(x-W3)*.45;else s+=(x-W2)*.42}
 else{s=up56(x);if(x>W1){const v=s,h=up56(W1)+(x-W1)*.42;s=Math.min(h,v)}}
 return Math.floor(s)}
function pvAN(P){let v=1.8;if(P.kids==0)v+=.6;else if(P.kids>=2)v-=.25*(Math.min(P.kids,5)-1);if(P.bl=='SN')v+=.5;return v}
function taxes(SB,P){
 const kvr=7.3+P.kvz/2,pvr=pvAN(P),kvb=Math.min(SB,69750/12),rvb=Math.min(SB,101400/12);
 const kv=r2(kvb*kvr/100),rv=r2(rvb*.093),av=r2(rvb*.013),pv=r2(kvb*pvr/100);
 const jr=SB*12,kl=P.kl,vr=Math.min(jr,101400)*.093,
  vkp=kl=='VI'?0:Math.min(jr,69750)*((.07+P.kvz/200)+pvr/100),valv=kl=='VI'?0:Math.min(jr,101400)*.013,
  vsp=Math.ceil(Math.max(vkp+vr,vr+Math.min(1900,valv+vkp))-1e-9),
  efa=kl=='II'?4260+Math.max(0,P.kids-1)*240:0,
  zve=Math.floor(Math.max(0,jr-Math.min(jr,1230)-36-efa-vsp));
 const stx=kl=='III'?tarif(zve/2)*2:(kl=='V'||kl=='VI')?st56(zve):tarif(zve);
 const lst=Math.floor(stx*100/12)/100,free=20350*(kl=='III'?2:1),soliJ=stx>free?Math.min(stx*.055,(stx-free)*.119):0,
  soli=Math.floor(soliJ*100/12)/100,kr=(P.bl=='BW'||P.bl=='BY')?8:9,kst=P.kirche?r2(lst*kr/100):0;
 return{lst,kst,soli,kv,rv,av,pv,zve,vsp,kr,kvr,pvr}}

function calcB(){
 const P=bp(),n=new Date(BY,BM+1,0).getDate(),H=holidays(BY,P.bl),sh=D.sheets.find(s=>s.t=='p'&&s.y==BY&&s.m==BM),rows=sh?sh.rows:{},days=[];
 for(let d=1;d<=n;d++){const w=rows[d]||{},g=new Date(BY,BM,d).getDay(),worked=!!(w.b&&w.e);
  days.push({d,g,w,worked,mins:worked?dur(w):0,st:w.x||'',hol:H[BM+'-'+d]||''})}
 const pool=days.filter(x=>x.worked&&x.g!=6),avg=pool.length?pool.reduce((a,x)=>a+x.mins,0)/pool.length:480,avgMin=P.vh>0?P.vh*60:avg;
 let pm=0,sp=0,nSp=0,nSat=0,uD=0,gr=0;const S5={n25:0,n40:0,s50:0,h125:0,h150:0};
 for(const x of days){const wk=x.g>=1&&x.g<=5;let pmin=0;x.kind='';
  if(x.worked){x.kind='w';pmin=(x.g==6&&!P.satH)?0:x.mins}
  else if(wk&&x.st=='U'){x.kind='U';pmin=avgMin;uD++}
  else if(wk&&x.st=='K'){x.kind='K';pmin=avgMin}
  else if(wk&&x.hol&&P.hol&&!x.st){x.kind='F';pmin=avgMin}
  x.pmin=pmin;pm+=pmin;x.gross=pmin/60*P.hr;gr+=x.gross;
  x.sp=(x.worked&&x.g!=6)?P.sp:0;sp+=x.sp;if(x.sp)nSp++;
  x.sat=(x.worked&&x.g==6)?P.satnet:0;if(x.sat)nSat++;
  if(x.worked){const r=surch(BY,BM,x.d,x.w,H);for(const k in S5)S5[k]+=r[k]}}
 const f=P.gl/60,A={n25:S5.n25*.25*f,n40:S5.n40*.4*f,s50:S5.s50*.5*f,h125:S5.h125*1.25*f,h150:S5.h150*1.5*f};
 const wc=days.filter(x=>x.worked).length,nightA=A.n25+A.n40,sfnP=wc?nightA/wc*uD:0,surT=A.n25+A.n40+A.s50+A.h125+A.h150,SB=gr+sfnP;
 const tx=taxes(SB,P),ded=tx.lst+tx.kst+tx.soli+tx.kv+tx.rv+tx.av+tx.pv,rt=SB>0?ded/SB:0;
 for(const x of days){x.net=x.gross*(1-rt)+x.sat;x.tot=x.net+x.sp}
 const gesamt=SB+sp+surT,netto=gesamt-ded,satT=nSat*P.satnet;
 return{P,days,sh,pm,gr,sfnP,SB,sp,nSp,nSat,uD,S5,A,surT,tx,ded,gesamt,netto,satT,payout:netto+satT,avgMin,sumNet:days.reduce((a,x)=>a+x.net,0),sumTot:days.reduce((a,x)=>a+x.tot,0)}}

/* ---------- Fényképek ---------- */
const ph=()=>`<h2>Fényképek</h2><div class="card row"><select onchange="PM=+this.value;loadPh()">${opts(MO,PM)}</select><select onchange="PY=+this.value;loadPh()">${opts(YR,PY)}</select></div>
<div class="pg">${SL.map(([k,t])=>{const u=PH[pn(k)];return `<button class="pk${u?' ok':''}" onclick="pick('${k}')">${u?`<img src="${u}">`:ic(k)}<span>${t}${u?' ✔':''}</span></button>`}).join('')}</div>
<div class="card row" style="margin-top:12px"><button onclick="sendPhotos()">Képek küldése most</button><small>Sikeres küldés után a képek törlődnek.</small></div>`;
async function loadPh(){PH={};
 try{const b=sb.storage.from('vd-photos'),d=pdir(),{data:f}=await b.list(d),n=(f||[]).filter(x=>x.name.endsWith('.jpg'));
  if(n.length){const{data:u}=await b.createSignedUrls(n.map(x=>d+'/'+x.name),3600);
   (u||[]).forEach((x,i)=>{if(x.signedUrl)PH[n[i].name.slice(0,-4)]=x.signedUrl})}}catch(e){}
 if(V=='ph')draw()}
function closeOv(){const o=$('#ov');if(o)o.remove()}
function pick(k){PK=k;const o=document.createElement('div');o.id='ov';
 o.innerHTML=`<div class="card"><h3>${SL.find(x=>x[0]==k)[1]}</h3><div class="row"><button onclick="$('#fc').click()">📷 Fényképezés</button><button class="g" onclick="$('#fg').click()">🖼 Galéria</button></div><br>${PH[pn(k)]?'<button class="r" onclick="delPh()">Kép törlése</button> ':''}<button class="g" onclick="closeOv()">Mégse</button><input id="fc" type="file" accept="image/*" capture="environment" hidden onchange="upPh(this)"><input id="fg" type="file" accept="image/*" hidden onchange="upPh(this)"></div>`;
 document.body.appendChild(o)}
async function upPh(i){const f=i.files[0];if(!f)return;closeOv();
 try{const bm=await createImageBitmap(f),sc=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
  const{error}=await sb.storage.from('vd-photos').upload(pdir()+'/'+pn(PK)+'.jpg',bl,{upsert:true,contentType:'image/jpeg'});
  if(error)throw error}catch(e){alert('Feltöltés sikertelen: '+(e.message||e))}
 loadPh()}
async function delPh(){closeOv();
 try{await sb.storage.from('vd-photos').remove([pdir()+'/'+pn(PK)+'.jpg'])}catch(e){alert(e.message)}
 loadPh()}
async function sendPhotos(){
 if(!MC||!MC.has_pass||!MC.recipient_email)return alert('Előbb add meg a Profilban a címeket és az alkalmazásjelszót.');
 try{const r=await call({action:'photos',y:PY,m:PM});alert(`Elküldve (${r.photos} kép) ide: ${r.to}`);loadPh()}catch(e){alert(e.message)}}

/* ---------- PDF import (jelenléti és tankolási ív, a fülnek megfelelően) ---------- */
async function imp(inp,want){const f=inp.files[0];inp.value='';if(!f)return;
 try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,R=[];
  for(let n=1;n<=pdf.numPages;n++){const tc=await(await pdf.getPage(n)).getTextContent();
   const it=tc.items.map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],c:i.transform[4]+i.width/2})).filter(i=>i.s).sort((a,b)=>b.y-a.y||a.x-b.x);
   let g=null;for(const i of it){if(g&&g.pg==n&&Math.abs(g.y-i.y)<2.5)g.it.push(i);else R.push(g={pg:n,y:i.y,it:[i]})}}
  R.forEach(r=>r.it.sort((a,b)=>a.x-b.x));
  const first=R.findIndex(r=>r.it[0].s=='1');if(first<2)throw Error('forma');
  const top=R[0].it.map(i=>i.s).join(' '),my=top.match(/MONAT\/JAHR:\s*(\S+)\s+(\d{4})/),m=my?MON.indexOf(my[1]):-1;
  if(m<0)throw Error('forma');
  const H=R.slice(1,first).flatMap(r=>r.it),hs=H.map(i=>i.s).join(' '),t=/Kennzeichen/.test(hs)?'t':/Beginn/.test(hs)?'p':null;
  if(!t)throw Error('forma');
  if(want&&t!=want)return alert(want=='t'?'Ez jelenléti PDF, a Tankolás fülön tankolási PDF-et importálj.':'Ez tankolási PDF, a Jelenléti fülön jelenléti PDF-et importálj.');
  const cs=[];H.map(i=>i.c).sort((a,b)=>a-b).forEach(c=>{const l=cs[cs.length-1];if(l&&c-l.v<6){l.v=(l.v*l.n+c)/(l.n+1);l.n++}else cs.push({v:c,n:1})});
  if(cs.length!=(t=='t'?6:8))throw Error('forma');
  const F=t=='t'?[null,'l','n','k','i','a']:[null,'b','e','p',null,'x','r','s'],rows={};
  for(const r of R.slice(first)){if(!/^\d{1,2}$/.test(r.it[0].s))continue;
   const d=+r.it[0].s;if(d<1||d>31)continue;const cell=cs.map(()=>[]);
   for(const i of r.it){let j=0;cs.forEach((c,k)=>{if(Math.abs(c.v-i.c)<Math.abs(cs[j].v-i.c))j=k});cell[j].push(i.s)}
   const w={};cell.forEach((a,j)=>{const k=F[j],v=a.join(' ').trim();if(!k||!v)return;
    if((k=='b'||k=='e')&&!/^\d{2}:\d{2}$/.test(v))return;
    if(k=='p'&&v!='0'&&v!='1')return;
    if(k=='x'&&v!='K'&&v!='U'&&v!='A')return;
    w[k]=v});
   if(Object.keys(w).length)rows[d]=w}
  const y=+my[2],nm=(top.match(/NAME:\s*(.*?)\s*MONAT\/JAHR:/)||[])[1]||'',old=D.sheets.find(s=>s.t==t&&s.m==m&&s.y==y);
  if(old&&!confirm(`Már van ${MON[m]} ${y} ív, felülírod az importtal?`))return;
  S={id:old?old.id:Date.now(),t,y,m,name:nm||D.name,rows,sig:old?old.sig:(D.sig||''),ts:Date.now()};
  D.sheets=D.sheets.filter(s=>!(s.t==t&&s.m==m&&s.y==y));D.sheets.push(S);save();go('e')}
 catch(e){alert('Az import nem sikerült. Csak az alkalmazás által készített jelenléti/tankolási PDF olvasható be.')}}

 <div class="card"><h3>E-mail küldés (saját Gmail)</h3>
 <p><label>Saját Gmail-cím (erről megy a levél)<br><input id="ms" value="${esc(M.sender_email)}"></label></p>

 ${M.has_pass?'<p>✔ A jelszó el van mentve</p><button class="r" onclick="delPass()">Jelszó törlése</button>':'<p><input id="mp" type="password" placeholder="Alkalmazásjelszó"></p><button onclick="savePass()">Jelszó mentése és kipróbálása</button>'}</div>
 <div class="card"><button onclick="sendPrev()">Előző hónap küldése most</button></div>

 ${[['routes','Mentett útvonalak'],['lkw','Mentett LKW számok'],['kenn','Mentett Kennzeichen']].map(([k,t])=>`<div class="card"><h3>${t}</h3>${D[k].map((x,i)=>`<div class="row" style="justify-content:space-between;margin:4px 0">${esc(x)}<button class="r" onclick="del('${k}',${i})">✕</button></div>`).join('')||'<i>üres</i>'}</div>`).join('')}`}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
loadLogo();
sb.auth.getSession().then(({data})=>{const u=data.session?.user.email.split('@')[0];u?load(u):(cur=null,draw())});
</script></body></html>
